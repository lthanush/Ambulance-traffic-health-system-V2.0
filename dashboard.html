<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Monitoring Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    header {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
    }
    
    .status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
    
    .status.connected {
      background: #4caf50;
      color: white;
    }
    
    .status.waiting {
      background: #ff9800;
      color: white;
    }
    
    .vitals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .vital-card {
      background: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    
    .vital-card:hover {
      transform: translateY(-5px);
    }
    
    .vital-label {
      color: #666;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    
    .vital-value {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .vital-unit {
      color: #999;
      font-size: 18px;
      margin-left: 5px;
    }
    
    .vital-status {
      font-size: 14px;
      padding: 5px 10px;
      border-radius: 5px;
      display: inline-block;
    }
    
    .normal {
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .warning {
      background: #fff3e0;
      color: #e65100;
    }
    
    .critical {
      background: #ffebee;
      color: #c62828;
    }
    
    .heart-rate .vital-value {
      color: #e91e63;
    }
    
    .spo2 .vital-value {
      color: #2196f3;
    }
    
    .history-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .history-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: #f5f5f5;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    
    th {
      font-weight: 600;
      color: #666;
      font-size: 14px;
    }
    
    tbody tr:hover {
      background: #fafafa;
    }
    
    .timestamp {
      color: #999;
      font-size: 13px;
    }
    
    .no-data {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏥 Patient Monitoring Dashboard</h1>
      <p class="subtitle">Real-time vital signs from ambulance</p>
      <span class="status waiting" id="connectionStatus">Waiting for data...</span>
    </header>
    
    <div class="vitals-grid">
      <div class="vital-card heart-rate">
        <div class="vital-label">Heart Rate</div>
        <div class="vital-value" id="heartRateValue">
          --<span class="vital-unit">BPM</span>
        </div>
        <div class="vital-status normal" id="heartRateStatus">Waiting...</div>
      </div>
      
      <div class="vital-card spo2">
        <div class="vital-label">Blood Oxygen (SpO2)</div>
        <div class="vital-value" id="spo2Value">
          --<span class="vital-unit">%</span>
        </div>
        <div class="vital-status normal" id="spo2Status">Waiting...</div>
      </div>
    </div>
    
    <div class="history-section">
      <div class="history-header">📊 Recent Readings</div>
      <table id="historyTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Heart Rate</th>
            <th>SpO2</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="4" class="no-data">No data received yet</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <script>
    function updateCurrentData() {
      fetch('/api/current-data')
        .then(response => response.json())
        .then(data => {
          if (data.receivedAt) {
            document.getElementById('connectionStatus').textContent = 'Connected';
            document.getElementById('connectionStatus').className = 'status connected';
            
            const hrValue = data.heartRate || 0;
            document.getElementById('heartRateValue').innerHTML = 
              `${hrValue}<span class="vital-unit">BPM</span>`;
            
            const hrStatus = document.getElementById('heartRateStatus');
            if (hrValue > 120 || hrValue < 50) {
              hrStatus.textContent = 'Abnormal';
              hrStatus.className = 'vital-status critical';
            } else if (hrValue > 100 || hrValue < 60) {
              hrStatus.textContent = 'Monitor';
              hrStatus.className = 'vital-status warning';
            } else {
              hrStatus.textContent = 'Normal';
              hrStatus.className = 'vital-status normal';
            }
            
            const spo2Value = data.spo2 || 0;
            document.getElementById('spo2Value').innerHTML = 
              `${spo2Value}<span class="vital-unit">%</span>`;
            
            const spo2Status = document.getElementById('spo2Status');
            if (spo2Value < 90) {
              spo2Status.textContent = 'Critical - Low O2';
              spo2Status.className = 'vital-status critical';
            } else if (spo2Value < 95) {
              spo2Status.textContent = 'Below Normal';
              spo2Status.className = 'vital-status warning';
            } else {
              spo2Status.textContent = 'Normal';
              spo2Status.className = 'vital-status normal';
            }
          }
        })
        .catch(err => console.error('Error fetching data:', err));
    }
    
    function updateHistory() {
      fetch('/api/recent-data')
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById('historyBody');
          
          if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="no-data">No data received yet</td></tr>';
            return;
          }
          
          tbody.innerHTML = data.map(record => {
            const time = new Date(record.receivedAt).toLocaleTimeString();
            const hrStatus = (record.heartRate > 120 || record.heartRate < 50) ? 'critical' :
                            (record.heartRate > 100 || record.heartRate < 60) ? 'warning' : 'normal';
            const spo2Status = record.spo2 < 90 ? 'critical' : record.spo2 < 95 ? 'warning' : 'normal';
            
            const overallStatus = (hrStatus === 'critical' || spo2Status === 'critical') ? 'Critical' :
                                 (hrStatus === 'warning' || spo2Status === 'warning') ? 'Monitor' : 'Normal';
            
            const statusClass = overallStatus === 'Critical' ? 'critical' :
                               overallStatus === 'Monitor' ? 'warning' : 'normal';
            
            return `
              <tr>
                <td class="timestamp">${time}</td>
                <td>${record.heartRate} BPM</td>
                <td>${record.spo2}%</td>
                <td><span class="vital-status ${statusClass}">${overallStatus}</span></td>
              </tr>
            `;
          }).join('');
        })
        .catch(err => console.error('Error fetching history:', err));
    }
    
    updateCurrentData();
    updateHistory();
    
    setInterval(updateCurrentData, 2000);
    setInterval(updateHistory, 5000);
  </script>
</body>
</html>
